name: Tests

on:
    push:
        branches:
            - main
            - develop
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        name: Run tests
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: requirements_test.txt

            - name: Install dependencies
              run: |
                  pip install -r requirements_test.txt

            # Configuration (test paths, asyncio mode) lives in pyproject.toml only.
            - name: Run tests
              run: |
                  pytest -v --tb=short
