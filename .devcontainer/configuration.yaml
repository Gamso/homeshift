homeassistant:
  name: HomeShift DevContainer
  latitude: 48.8566
  longitude: 2.3522
  elevation: 0
  unit_system: metric
  country: FR
  time_zone: Europe/Paris

# default_config: pulls in bluetooth/usb/dhcp/ssdp/cloud/assist_pipeline/
# conversation/stream/mobile_app/go2rtc — none of which work (or matter) in a
# devcontainer, and their on-the-fly pip installs are what caused frontend to
# fail to load (concurrent installs during startup). Declare only what's
# actually useful for testing HomeShift instead. frontend/config/automation/
# script/scene are already pulled in via lovelace: below and core bootstrap.
history:
logbook:

# Enable development mode
logger:
  default: info
  logs:
    homeassistant.components.lovelace: debug
    custom_components.homeshift: debug

# User interface - use YAML mode to load ui-lovelace.yaml
lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Scheduler integration
scheduler:
  # No specific config needed, component will auto-configure

# Simulated test devices
input_boolean:
  living_room_cover_open:
    name: Living Room Cover State
    initial: true
  office_cover_open:
    name: Office Cover State
    initial: true
  # Back the two simulated Versatile Thermostat auto start/stop switches below.
  salon_auto_start_stop:
    name: Salon auto start/stop (simulated)
    initial: true
  chambre_auto_start_stop:
    name: Chambre auto start/stop (simulated)
    initial: true

input_number:
  outdoor_temperature:
    name: Outdoor Temperature (simulated)
    initial: 20
    min: -10
    max: 50
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

template:
  - sensor:
      - name: "Outdoor Temperature"
        unique_id: sensor_outdoor_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        state: "{{ states('input_number.outdoor_temperature') }}"
  # Stand-ins for switch.<vtherm>_enable_auto_start_stop, to try the heat
  # pump auto start/stop without a Versatile Thermostat.
  - switch:
      - name: "Salon Enable auto start/stop"
        unique_id: switch_salon_enable_auto_start_stop
        state: "{{ is_state('input_boolean.salon_auto_start_stop', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.salon_auto_start_stop
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.salon_auto_start_stop
      - name: "Chambre Enable auto start/stop"
        unique_id: switch_chambre_enable_auto_start_stop
        state: "{{ is_state('input_boolean.chambre_auto_start_stop', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.chambre_auto_start_stop
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.chambre_auto_start_stop
  - cover:
      - name: "Living Room Cover"
        unique_id: cover_living_room
        device_class: shutter
        state: "{{ 'open' if is_state('input_boolean.living_room_cover_open', 'on') else 'closed' }}"
        open_cover:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.living_room_cover_open
        close_cover:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.living_room_cover_open
        stop_cover:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.living_room_cover_open
      - name: "Office Cover"
        unique_id: cover_office
        device_class: shutter
        state: "{{ 'open' if is_state('input_boolean.office_cover_open', 'on') else 'closed' }}"
        open_cover:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.office_cover_open
        close_cover:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.office_cover_open
        stop_cover:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.office_cover_open
