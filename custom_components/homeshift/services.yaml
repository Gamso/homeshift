refresh_schedulers:
  name: Refresh Schedulers
  description: Refresh scheduler states based on current day mode and thermostat mode
  fields: {}

sync_calendar:
  name: Sync Calendar
  description: Re-sync the calendar and update the current day mode
  fields: {}

open_covers:
  name: Open covers
  description: Open the covers of the daily schedule now, whatever the time or the day mode
  fields: {}

close_covers:
  name: Close covers
  description: Close the covers of the daily schedule now, like the evening close (open window and My button rules included)
  fields: {}

inhibit_covers:
  name: Inhibit Covers
  description: >-
    Temporarily take covers out of the automation (daily open/close, heat
    protection and the open/close-now actions). With neither a duration nor an end date, they stay inhibited
    until resumed.
  fields:
    entity_id:
      name: Covers
      description: Covers to leave alone. Only the covers HomeShift drives are accepted.
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
    duration:
      name: Duration
      description: How long the covers stay inhibited.
      selector:
        duration:
          enable_day: true
    until:
      name: Until
      description: When the inhibition ends (instead of a duration).
      selector:
        datetime:

resume_covers:
  name: Resume Covers
  description: >-
    Hand inhibited covers back to the automation. They rejoin the next
    scheduled action; nothing moves right away.
  fields:
    entity_id:
      name: Covers
      description: Covers to resume. Leave empty to resume every inhibited cover.
      selector:
        entity:
          domain: cover
          multiple: true
