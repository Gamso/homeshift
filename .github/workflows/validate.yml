name: Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate the integration with Home Assistant's hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    name: HACS
    steps:
      - name: Validate the repository for HACS
        uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: |
          pip install "$(grep '^ruff==' requirements_dev.txt)"

      # Rules and line length are configured in pyproject.toml.
      - name: Run ruff
        run: |
          ruff check custom_components tests scripts

  card:
    runs-on: ubuntu-latest
    name: Card build, lint and tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Committed bundle matches the sources
        run: |
          if ! git diff --exit-code --stat -- ../custom_components/homeshift/www/; then
            echo "::error::The card bundle is out of date: run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    name: Type check
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      # Home Assistant comes with the test requirements; pyright is pinned in
      # requirements_dev.txt. Rules live in pyrightconfig.json: errors fail
      # the job, warnings are reported.
      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt "$(grep '^pyright==' requirements_dev.txt)"

      - name: Run pyright
        run: |
          pyright custom_components
