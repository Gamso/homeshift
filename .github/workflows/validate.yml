name: Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate the integration with Home Assistant's hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    name: HACS
    steps:
      - name: Validate the repository for HACS
        uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: |
          pip install "$(grep '^ruff==' requirements_dev.txt)"

      # Rules and line length are configured in pyproject.toml.
      - name: Run ruff
        run: |
          ruff check custom_components tests scripts

  validate:
    runs-on: ubuntu-latest
    name: Validate custom component
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run validation script
        run: |
          chmod +x validate.sh
          ./validate.sh
