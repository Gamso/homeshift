name: Release

# Builds the card and attaches the integration to the GitHub release as
# homeshift.zip, which HACS installs (hacs.json: zip_release). The card
# bundle is not committed: it only exists in that archive.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach homeshift.zip to
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    name: Build and attach homeshift.zip
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the card
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Check the manifest version
        run: |
          version=$(jq -r .version custom_components/homeshift/manifest.json)
          if [ "$version" != "$TAG" ]; then
            echo "::warning::manifest.json says $version, the release is $TAG"
          fi

      # HACS extracts the archive into custom_components/homeshift/, so the
      # integration's files sit at its root.
      - name: Package the integration
        run: |
          test -s custom_components/homeshift/www/homeshift-card.js
          cd custom_components/homeshift
          zip -r "$GITHUB_WORKSPACE/homeshift.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" homeshift.zip --clobber
