[tool.black]
# Work !
line-length = 180

[tool.ruff]
line-length = 180
# Home Assistant 2026.11, the minimum, runs on Python 3.14.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

# The only pytest configuration of the repository.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
